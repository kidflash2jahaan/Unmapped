<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unmapped</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <p class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><circle cx="14" cy="14" r="11" stroke="currentColor" stroke-width="2.2" stroke-dasharray="52 17.1" transform="rotate(-38 14 14)"/><circle cx="14" cy="14" r="3.4" fill="currentColor"/></svg>
      Unmapped
    </p>
    <nav class="crumbs" aria-label="Breadcrumb">
      <svg class="slash" width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 18"/></svg>
      <span id="crumb-section">Scans</span>
      <svg class="slash" width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 18"/></svg>
      <b id="crumb-leaf">New scan</b>
    </nav>
    <span class="spacer"></span>
    <button type="button" class="cmd" id="cmd">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="m12.2 12.2 4 4"/></svg>
      Open a photo
      <span class="kb" id="cmd-key">⌘K</span>
    </button>
    <span class="chip local"><i></i>Runs locally</span>
    <button type="button" class="icon-btn" id="theme" aria-label="Switch to dark theme">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
    </button>
  </header>

  <div class="page">
    <div class="head">
      <div class="title">
        <h1 id="title" tabindex="-1"></h1>
        <p class="meta" id="meta"></p>
      </div>
      <span class="spacer"></span>
      <nav class="tabs" aria-label="Steps">
        <button type="button" class="tab" id="tab-attack">Attack <span class="kb">1</span></button>
        <button type="button" class="tab" id="tab-protect" disabled>Protect <span class="kb">2</span></button>
        <button type="button" class="tab" id="tab-profile">Profile <span class="kb">3</span></button>
      </nav>
      <div class="action" id="action"></div>
    </div>
    <main id="app"></main>
  </div>

  <footer class="foot">
    <span>Runs on this laptop. Photos leave it only if you click Check with Claude.</span>
    <span class="spacer"></span>
    <span id="photo-credit"></span>
    <span id="map-credit"></span>
  </footer>
  <p class="sr" id="say" aria-live="polite"></p>

  <input type="file" id="pick-one" accept="image/jpeg,image/png,image/heic,image/heif,.heic,.heif" hidden>
  <input type="file" id="pick-many" accept="image/jpeg,image/png,image/heic,image/heif,.heic,.heif" multiple hidden>

  <!-- screen: start -->
  <template id="tpl-start">
    <section class="start">
      <section class="card drop" id="drop-zone">
        <button type="button" class="drop-btn" id="drop">
          <span class="drop-ico" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg></span>
          <span class="drop-title">Drop a photo here</span>
          <span class="drop-sub">or click to choose one. JPEG, PNG or iPhone HEIC.</span>
        </button>
        <ul class="rows checks-list">
          <li class="row"><span class="ico" data-icon="pin"></span><div><p class="rt">GPS, camera and time</p><p class="rd">Read straight from the file</p></div></li>
          <li class="row"><span class="ico" data-icon="globe"></span><div><p class="rt">Location from the pixels</p><p class="rd">GeoCLIP, an open AI model, guesses where it was taken</p></div></li>
          <li class="row"><span class="ico" data-icon="text"></span><div><p class="rt">Readable text and faces</p><p class="rd">Apple's on-device detectors find signs and people</p></div></li>
        </ul>
      </section>
      <section class="card ex-card">
        <div class="ch"><h2>Examples</h2><span class="aside">True spot known, so every error is real</span></div>
        <div id="examples"><p class="pad fine">Loading examples...</p></div>
      </section>
    </section>
  </template>

  <!-- screen: waiting -->
  <template id="tpl-wait">
    <section class="wait">
      <figure class="photo-panel wait-photo" id="wait-left"></figure>
      <section class="card wait-card" role="status">
        <div class="ch"><h2 id="wait-title"></h2><span class="aside">On this laptop</span></div>
        <div class="wait-body">
          <p class="sl">Elapsed</p>
          <p class="elapsed" id="elapsed">0<small>s</small></p>
          <div class="track" aria-hidden="true"><span></span></div>
          <p class="wait-detail" id="wait-detail"></p>
        </div>
        <ol class="rows plan" id="plan"></ol>
      </section>
    </section>
  </template>

  <!-- screen: error -->
  <template id="tpl-error">
    <section class="error">
      <div class="card err-card" role="alert">
        <span class="ico hot" data-icon="alert"></span>
        <h2>Unmapped couldn't finish that</h2>
        <p id="error-text"></p>
        <button type="button" class="btn ghost" id="back">Start over</button>
      </div>
    </section>
  </template>

  <!-- screen: attack -->
  <template id="tpl-attack">
    <section class="grid attack">
      <figure class="photo-panel">
        <div class="shot" id="shot">
          <img id="photo" alt="">
          <div class="heat-layer" id="heat-layer"><canvas id="heat-canvas"></canvas><div class="cells"></div></div>
          <div class="marks" id="marks"></div>
        </div>
        <div class="toolbar" role="group" aria-label="Photo view">
          <button type="button" class="tool" id="mode-heat" aria-pressed="true">Heatmap <span class="kb">H</span></button>
          <button type="button" class="tool" id="mode-text" aria-pressed="true">Text <span class="kb">T</span></button>
          <button type="button" class="tool" id="mode-original" aria-pressed="false">Original <span class="kb">O</span></button>
        </div>
        <figcaption class="legend" id="legend"><span>What drove the guess</span><span class="spacer"></span><span class="dim">Low</span><span class="ramp"></span><span class="dim">High</span></figcaption>
      </figure>
      <section class="card">
        <div class="ch"><h2>What gave it away</h2><span class="aside" id="flag-count"></span></div>
        <ul class="rows" id="findings"></ul>
      </section>
      <section class="card map-card">
        <div class="ch"><h2>Where the attacker thinks you are</h2><span class="aside">Top guess</span></div>
        <div class="map-box" id="map-box"></div>
        <div class="stats" id="stats"></div>
      </section>
      <section class="card strip">
        <div class="score" id="score-box"></div>
        <div class="ruler"><h2 id="ruler-title">How far off the attacker lands</h2><span class="aside">Log scale, km</span><svg id="ruler" aria-hidden="true"></svg></div>
      </section>
    </section>
    <div class="bar">
      <fieldset class="options">
        <legend>Protect will</legend>
        <label class="opt"><input type="checkbox" id="opt-text" checked> Blur text</label>
        <label class="opt"><input type="checkbox" id="opt-faces" checked> Blur faces</label>
        <label class="opt"><input type="checkbox" id="opt-cloak" checked> Add the invisible cloak, about 30 s</label>
      </fieldset>
      <span class="spacer"></span>
      <button type="button" class="btn ghost" id="new">New photo</button>
    </div>
  </template>

  <!-- screen: protected -->
  <template id="tpl-protected">
    <section class="grid attack protected">
      <figure class="photo-panel">
        <div class="shot compare" id="shot">
          <img id="before" alt="Original photo" draggable="false">
          <div class="after"><img id="after" alt="Protected photo" draggable="false"><div class="marks" id="blurs"></div></div>
          <div class="marks" id="blur-labels"></div>
          <div class="handle" id="handle" role="slider" tabindex="0" aria-label="Compare protected and original" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
            <span class="knob"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6 3 11l5 5M14 6l5 5-5 5"/></svg></span>
          </div>
        </div>
        <div class="toolbar"><span class="tool">Drag to compare <span class="kb">← →</span></span></div>
        <span class="side left"><i class="safe"></i>Protected</span>
        <span class="side right"><i></i>Original</span>
      </figure>
      <section class="card">
        <div class="ch"><h2>What Protect changed</h2><span class="aside" id="step-count"></span></div>
        <ul class="rows" id="checks"></ul>
      </section>
      <section class="card map-card">
        <div class="ch"><h2>Where the attacker thinks you are now</h2><span class="aside">Top 5 guesses</span></div>
        <div class="map-box" id="map-box"></div>
        <div class="stats" id="stats"></div>
      </section>
      <section class="card strip">
        <div class="score" id="score-box"></div>
        <div class="ruler"><h2 id="ruler-title">How far off the attacker lands</h2><span class="aside">Log scale, km</span><svg id="ruler" aria-hidden="true"></svg></div>
      </section>
    </section>
    <div class="bar">
      <p class="honest" id="honest"></p>
      <div class="claude" id="claude-out">
        <button type="button" class="btn ghost" id="claude-test">Check with Claude</button>
        <span class="fine">Sends both photos to Anthropic</span>
      </div>
      <button type="button" class="btn ghost" id="again">New photo</button>
    </div>
  </template>

  <!-- screen: profile feed -->
  <template id="tpl-feed">
    <section class="feed">
      <section class="card feed-card" id="feed-drop">
        <div class="ch"><h2>Posts</h2><span class="aside" id="feed-count"></span><button type="button" class="btn ghost small" id="add">Add photos</button></div>
        <div class="posts-box" id="posts"></div>
      </section>
      <section class="card why-card">
        <div class="ch"><h2>Why a feed is riskier than one photo</h2></div>
        <div class="why-body">
          <p class="why-big">Each photo alone is vague. Together they point to one neighborhood.</p>
          <p>Unmapped attacks each photo with GeoCLIP, multiplies the guesses together the way a stalker would, then scans the captions for school, team, home and routine.</p>
          <p class="fine">Run it on your own feed as a self-audit.</p>
          <div class="why-actions">
            <button type="button" class="btn ghost" id="example-feed">Load example feed</button>
            <span class="fine" id="example-note"></span>
          </div>
          <div class="sample" id="sample" aria-hidden="true"></div>
        </div>
      </section>
    </section>
  </template>

  <!-- screen: profile result -->
  <template id="tpl-profile">
    <section class="profile">
      <section class="card nums-card">
        <div class="ch"><h2>Alone vs together</h2></div>
        <div class="narrow">
          <div><p class="sl" id="alone-label"></p><p class="big-km alone" id="alone"></p></div>
          <svg class="narrow-arrow" viewBox="0 0 60 24" aria-hidden="true"><path d="M2 12h54M46 4l10 8-10 8"/></svg>
          <div><p class="sl" id="together-label"></p><p class="big-km together" id="together"></p></div>
        </div>
        <div class="score" id="score-box"></div>
      </section>
      <section class="card map-card">
        <div class="ch"><h2>Where the feed points</h2><span class="aside" id="map-aside">Pills: each photo's guess</span></div>
        <div class="map-box" id="map-box"></div>
      </section>
      <section class="card cap-card">
        <div class="ch"><h2>What the captions say</h2><span class="aside" id="flagged"></span></div>
        <ol class="caplist" id="caplist"></ol>
      </section>
      <section class="card axis-card">
        <div class="ch"><h2>Each photo on its own</h2><span class="aside">Log scale, km</span></div>
        <svg class="logaxis" id="axis" role="img" aria-label="Each photo's distance on a log scale"></svg>
      </section>
    </section>
  </template>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
